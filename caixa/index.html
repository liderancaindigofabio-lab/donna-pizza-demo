<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NONNA — Caixa</title><link rel="stylesheet" href="css/caixa.css?v=4"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"></head><body><div id="login" class="gate"><form id="loginForm"><b>NONNA</b><h1>Acesso ao Caixa</h1><input name="user" type="email" placeholder="E-mail" autocomplete="username" required><input name="pass" type="password" placeholder="Senha" required><p id="err"></p><button>Entrar</button></form></div><div id="app" hidden><header><a href="../">← NONNA</a><div><strong>CAIXA</strong><small id="operator">Operador</small></div><span id="cashState">● Conectando</span><span data-donna-connection class="connection">Conectando…</span></header><main><section class="workspace"><div class="toolbar"><input id="search" placeholder="Buscar produto..."></div><div id="cats" class="cats"></div><div id="products" class="products"></div></section><aside class="ticket"><h2>Venda atual</h2><div id="cart"><p class="empty">Nenhum item.</p></div><div class="discount-tools"><small class="discount-help">Desconto manual exige autorização de gerente ou proprietário.</small><label>Desconto<select id="discountType"><option value="none">Sem desconto</option><option value="amount">Valor (R$)</option><option value="percent">Percentual (%)</option></select></label><input id="discountValue" type="number" min="0" step="0.01" placeholder="0"><select id="coupon"><option value="">Cupom da Gestão</option></select></div><div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div><select id="payment"><option value="dinheiro">Dinheiro</option><option value="pix">Pix</option><option value="debito">Débito</option><option value="credito">Crédito</option><option value="misto">Pagamento misto</option></select><div id="paymentSplit" class="payment-split" hidden></div><button id="finish" class="primary">Finalizar venda</button></aside></main><section class="table-accounts"><div class="section-title"><h2>Comandas do salão</h2><button id="refreshTables">Atualizar</button></div><div id="tableComandas"><p class="empty">Nenhuma comanda aberta.</p></div></section><section class="cashbar"><button id="openCash">Abrir caixa</button><button id="withdraw">Sangria</button><button id="supply">Suprimento</button><button id="closeCash">Fechar caixa</button><span id="cashInfo"></span></section><section id="closingSummary" class="closing-summary" hidden></section></div><script src="../js/firebase/config.js?v=21"></script><script src="../js/firebase/loader.js?v=40"></script><script src="js/caixa.js?v=14"></script></body></html>
